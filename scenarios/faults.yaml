# Нештатные ситуации: срыв актуации шибера с повторной попыткой (RECOVERY),
# два товара вплотную (короткий интервал подачи), остановка ленты, товар с K
# у самой границы порога классификатора.
#
# Это единственный сценарий, где базовое допущение ТЗ "лента не останавливается"
# намеренно нарушается — belt_stop_events ниже проверяет, что FSM это обнаруживает
# (через CONFIRM по камере, а не веря заранее рассчитанному времени подлёта) и уходит
# в RECOVERY, а не тихо теряет товар.
scenario_name: faults
seed: 13
duration_s: 90
spawn_interval_s: 1.0
belt_speed_mps: 1.0
k_threshold: 0.7
camera_noise: false

belt_stop_events:
  - at_s: 8.0
    duration_s: 4.0

items:
  # box_400x400x300 у организаторов регулярно требует повторной попытки шибера
  # (см. results/typical) — здесь это целевой случай, а не побочный эффект
  - mesh: box_400x400x300.stl
    count: 4
    category_true: C
  # два товара вплотную: интервал подачи (1с) короче полного цикла одного товара
  - mesh: box_300x200x200.stl
    count: 4
    category_true: B
    interval_s: 0.6
  - mesh: borderline/box_449.stl   # K=0.707 — впритык к порогу 0.7 (низкая "уверенность")
    count: 3
