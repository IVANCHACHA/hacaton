# Развёртка по темпу подачи (SimPy, аналитическая модель — не полная физика,
# см. throughput/simpy_model.py) — ищем темп, при котором накопитель начинает
# переполняться при заданной ёмкости накопителя.
scenario_name: throughput
mode: throughput
seed: 21
duration_s: 600          # модельных секунд на каждую точку развёртки
belt_speed_mps: 1.0
accumulator_capacity: 15   # ёмкость накопителя, слотов — параметр исполнительной части
overflow_rate_limit: 0.001   # >0.1% отказов по переполнению — считаем порогом
category_mix:
  B: 0.5
  C: 0.2
  D: 0.3
throughput_rates_per_hour:
  - 2000
  - 3000
  - 3600   # верхняя граница целевого диапазона ТЗ
  - 4500
  - 6000
  - 7000
  - 8000
  - 9000
  - 10000
