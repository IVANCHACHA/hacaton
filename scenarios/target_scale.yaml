    count: 3
    category_true: B
  - mesh: borderline/box_max_input_500.stl  # 499x499x499 — впритык под абсолютный лимит входа, оверсайз для сортировщика
    count: 3
    category_true: C
  - mesh: box_400x400x300.stl               # реальный товар организаторов у верхней границы
    count: 3
    category_true: C
  - mesh: helmet.stl                        # крупный реальный товар организаторов, K>порога
    count: 3
    category_true: D
